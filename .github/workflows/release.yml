name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cli:
    uses: ./.github/workflows/cli.yml
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Check tag, version, history and release notes
        id: version
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v(?<version>\d+\.\d+\.\d+)$') { throw 'Expected a stable release tag.' }
          $version = $Matches.version
          $product = ([xml](Get-Content Directory.Build.props -Raw)).SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($product -cne $version) { throw 'Version differs from tag.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The tag must point to a commit on main.' }
          $notes = [regex]::Match((Get-Content docs/releases/release-notes.md -Raw), "(?ms)^## \[$([regex]::Escape($version))\].*?(?=^## \[|\z)")
          if (!$notes.Success) { throw 'Release notes are missing.' }
          New-Item -ItemType Directory artifacts -Force | Out-Null
          $notes.Value.Trim() | Set-Content -LiteralPath artifacts/release-notes.md
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: ./scripts/validate.ps1
      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 -y --no-progress
      - run: ./scripts/package.ps1 -Installer
      - name: Validate Windows setup and app startup
        run: ./scripts/smoke-install.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Validate packaged CLI
        run: ./scripts/smoke-cli.ps1 -Cli artifacts/cli/xiaflow-cli.dll
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64
          path: |
            artifacts/release/
            artifacts/release-notes.md
          if-no-files-found: error
  publish:
    needs: [package, cli]
    runs-on: windows-2025
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64
          path: artifacts
      - name: Sign installer metadata
        env:
          XIAFLOW_UPDATE_SIGNING_KEY: ${{ secrets.XIAFLOW_UPDATE_SIGNING_KEY }}
          PRODUCT_VERSION: ${{ needs.package.outputs.version }}
        run: ./scripts/new-update-manifest.ps1 -Version $env:PRODUCT_VERSION
      - name: Upload and verify all assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1 -Tag $env:GITHUB_REF_NAME
